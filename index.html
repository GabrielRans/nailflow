<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NailFlow</title>

    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/dashboard.css">
    <link rel="stylesheet" href="./css/movimentacoes.css">
    <script src="./js/app.js" defer></script>
    <script src="./js/movimentacoes-ui.js" defer></script>
  </head>
  <body>
      <h1>NailFlow</h1>

      <main>
        <section class="dashboard" aria-labelledby="dashboard-titulo">
          <h2 id="dashboard-titulo">Resumo financeiro</h2>

          <ul class="dashboard__indicadores">
            <li class="dashboard__card dashboard__card--receitas">
              <h3 class="dashboard__card-titulo">Receitas</h3>
              <p class="dashboard__card-valor" data-indicador="totalEntradas">—</p>
            </li>
            <li class="dashboard__card dashboard__card--despesas">
              <h3 class="dashboard__card-titulo">Despesas</h3>
              <p class="dashboard__card-valor" data-indicador="totalSaidas">—</p>
            </li>
            <li class="dashboard__card dashboard__card--saldo">
              <h3 class="dashboard__card-titulo">Saldo</h3>
              <p class="dashboard__card-valor" data-indicador="saldo">—</p>
            </li>
            <li class="dashboard__card dashboard__card--ticket">
              <h3 class="dashboard__card-titulo">Ticket médio</h3>
              <p class="dashboard__card-valor" data-indicador="ticketMedio">—</p>
            </li>
          </ul>

          <p class="dashboard__estado" role="status">
            Os valores serão exibidos após a integração dos indicadores financeiros.
          </p>
        </section>

        <section>
          <h2>Nova movimentação</h2>

          <form id="form-movimentacao">
            <div>
              <label for="tipo">Tipo</label>
              <select id="tipo" name="tipo" required>
                <option value="">Selecione</option>
                <option value="entrada">Entrada</option>
                <option value="saida">Saída</option>
              </select>
            </div>

            <div>
              <label for="valor">Valor</label>
              <input
                type="number"
                id="valor"
                name="valor"
                min="0.01"
                step="0.01"
                required
              >
            </div>

            <div>
              <label for="descricao">Descrição</label>
              <input
                type="text"
                id="descricao"
                name="descricao"
                maxlength="100"
                required
              >

            </div>

            <div>
              <label for="categoria">Categoria</label>
              <select id="categoria" name="categoria" required>
                <option value="">Selecione</option>
                <option value="procedimento">Procedimento</option>
                <option value="material">Material</option>
                <option value="servico">Serviço</option>
                <option value="outro">Outro</option>
              </select>
            </div>

            <div>
              <label for="data">Data</label>
              <input
                type="date"
                id="data"
                name="data"
                required
              >
            </div>

            <div>
              <label for="observacao">Observação</label>
              <textarea
                id="observacao"
                name="observacao"
                rows="4"
                maxlength="300"
              ></textarea>
            </div>

            <button type="submit">Salvar movimentação</button>
          </form>
        </section>

        <section>
          <h2>Movimentações salvas</h2>
          <ul id="lista-movimentacoes"></ul>
        </section>
      </main>
  </body>
</html>
